<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foundation Sheet Set — ephemeral-eng template V1.3</title>
<!--
═══════════════════════════════════════════════════════════════════════════
  ephemeral-eng SHEET-SET TEMPLATE · V1.0 · Oasis Engineering
  Two 24×36 sheets (S0.0 office sheet, S1.0 field sheet) rendered from one
  PROJECT object. Print → PDF. github.com/oasiseng/boxabl-foundations-guide

  PUBLISHED-SAFE BOUNDARY: this file ships with PROJECT.engineered = false.
  In that mode every controlled value (footing geometry, reinforcing,
  concrete strength, slab reinforcement, materials takeoff) prints as
  "per engineered design" and the detail slots are empty. Loading a
  controlled project JSON (engineered: true, with values and detail images)
  turns it into a permit-ready set — that JSON stays in the paid workflow.

  ⚠️  Nothing this file prints is a design until reviewed, verified per
      VERIFICATION-SHEETS.md and sealed by the licensed engineer of record.
═══════════════════════════════════════════════════════════════════════════
-->
<style>
  :root{
    --brand:#2E5BD1;            /* logo blue   */
    --accent:#F26A1B;           /* logo orange */
    --ink:#111;
    --rule:#111;
    --grey:#666;
    --wash:#eef2fb;
    --font:'Arial Narrow','Liberation Sans Narrow','Helvetica Neue',Arial,sans-serif;
    --font-wide:Arial,'Liberation Sans',Helvetica,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#d9d9d9;font-family:var(--font-wide);color:var(--ink);}
  .panel{position:fixed;top:0;left:0;width:300px;height:100vh;overflow:auto;background:#fff;border-right:1px solid #ccc;padding:12px;font-size:12px;z-index:50;}
  .panel h1{font-size:14px;margin:0 0 4px;color:var(--brand);}
  .panel label{display:block;font-weight:700;margin-top:8px;font-size:11px;}
  .panel input,.panel select{width:100%;padding:4px 6px;font-family:monospace;font-size:11px;border:1px solid #bbb;border-radius:4px;}
  .panel .btn{display:block;width:100%;margin-top:8px;padding:8px;border:0;border-radius:4px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer;}
  .panel .btn.sec{background:#fff;color:var(--ink);border:1px solid #bbb;}
  .stage{margin-left:300px;padding:20px;}
  /* ── the sheet ────────────────────────────────────────────────── */
  .sheet{position:relative;width:36in;height:24in;background:#fff;margin:0 auto 24px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.25);font-size:9.5pt;line-height:1.25;}
  .border{position:absolute;left:1in;top:0.5in;width:34.5in;height:23in;border:0.02in solid var(--rule);}
  .content{position:absolute;left:1.1in;top:0.95in;width:31.5in;height:22.4in;}
  .tb{position:absolute;right:0.5in;top:0.5in;width:2.6in;height:23in;border-left:0.02in solid var(--rule);display:flex;flex-direction:column;}
  .tb > div{border-bottom:0.01in solid var(--rule);padding:0.08in 0.12in;}
  .tb .logo{display:flex;align-items:center;justify-content:center;height:1.6in;}
  .tb .logo img{max-width:2.3in;max-height:1.3in;}
  .tb .lbl{font-size:6pt;letter-spacing:.06em;color:var(--grey);text-transform:uppercase;}
  .tb .big{font-size:11pt;font-weight:700;}
  .tb .huge{font-size:26pt;font-weight:700;color:var(--brand);line-height:1;}
  .tb .flex1{flex:1;}
  .tb .stamp{height:2.5in;display:flex;align-items:center;justify-content:center;color:#999;font-style:italic;font-size:8pt;text-align:center;}
  .tb table{width:100%;border-collapse:collapse;font-size:7.5pt;}
  .tb table td,.tb table th{border:0.005in solid #999;padding:0.02in 0.04in;text-align:left;}
  .status-band{position:absolute;left:1in;top:0.5in;width:34.5in;height:0.25in;background:var(--accent);color:#fff;font-weight:700;font-size:9pt;letter-spacing:.12em;display:flex;align-items:center;justify-content:center;}
  .status-band.hidden{display:none;}
  /* slots */
  .slot{position:absolute;border:0.008in solid var(--rule);background:#fff;overflow:hidden;}
  .slot .head{position:absolute;left:0;right:0;bottom:0;height:0.42in;border-top:0.012in solid var(--rule);display:flex;align-items:center;gap:0.1in;padding:0 0.1in;background:#fff;}
  .slot .head .num{width:0.34in;height:0.34in;border:0.012in solid var(--rule);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10pt;}
  .slot .head .ttl{font-weight:700;font-size:13pt;letter-spacing:.02em;text-transform:uppercase;flex:1;}
  .slot .head .scl{font-size:8pt;color:var(--grey);}
  .slot .body{position:absolute;left:0.1in;right:0.1in;top:0.1in;bottom:0.5in;display:flex;align-items:center;justify-content:center;}
  .slot .body img{max-width:100%;max-height:100%;}
  .slot .body svg{max-width:100%;max-height:100%;}
  .imgwrap{position:relative;display:block;width:100%;height:100%;}
  .imgwrap img{display:block;width:100%;height:100%;object-fit:contain;object-position:center;}
  .imgwrap.tall{width:100%;height:100%;}
  .imgwrap.tall img{width:100%;height:100%;object-fit:contain;}
  .callout{position:absolute;transform:translate(-50%,-50%);width:0.55in;height:0.55in;border:0.012in solid var(--rule);border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10pt;font-weight:700;line-height:1;}
  .callout span{font-size:7pt;font-weight:400;border-top:0.008in solid var(--rule);padding-top:0.02in;margin-top:0.02in;}
  .overlay-txt{position:absolute;font-size:8.5pt;background:#fff;padding:0 0.02in;white-space:nowrap;}
  /* text blocks */
  .block{position:absolute;overflow:hidden;}
  .block h2{margin:0 0 0.08in;font-size:13pt;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-bottom:0.012in solid var(--rule);padding-bottom:0.03in;color:var(--ink);}
  .block h3{margin:0.14in 0 0.04in;font-size:10.5pt;font-weight:700;text-transform:uppercase;color:var(--brand);}
  .notes{column-gap:0.4in;font-size:10.4pt;line-height:1.32;}
  .notes ol{margin:0 0 0.08in 0.22in;padding:0;}
  .notes li{margin-bottom:0.06in;break-inside:avoid;}
  .notes h3{break-after:avoid;}
  table.kv{width:100%;border-collapse:collapse;font-size:9.8pt;}
  table.kv td{padding:0.04in 0.06in;border-bottom:0.005in dotted #999;vertical-align:top;}
  table.kv td:last-child{text-align:right;font-family:monospace;font-weight:700;white-space:nowrap;}
  table.grid{width:100%;border-collapse:collapse;font-size:9.6pt;}
  table.grid th,table.grid td{border:0.005in solid #777;padding:0.025in 0.05in;text-align:center;}
  table.grid th{background:var(--wash);}
  table.grid td:first-child{text-align:left;}
  .stub{position:absolute;left:0;top:0;width:31.5in;height:0.95in;border:0.012in solid var(--rule);background:var(--wash);display:grid;grid-template-columns:repeat(8,1fr);}
  .stub > div{border-right:0.005in solid #999;padding:0.08in 0.12in;}
  .stub > div:last-child{border-right:0;}
  .stub .k{font-size:7.5pt;text-transform:uppercase;letter-spacing:.06em;color:var(--grey);}
  .stub .v{font-size:15pt;font-weight:700;font-family:monospace;}
  .stub .s{font-size:8pt;color:var(--grey);}
  .seq{position:absolute;display:grid;grid-template-columns:repeat(7,1fr);gap:0.08in;}
  .seq .step{border:0.01in solid var(--rule);padding:0.05in 0.08in;position:relative;font-size:7.6pt;line-height:1.22;overflow:hidden;}
  .seq .step b{display:block;font-size:8.8pt;margin-bottom:0.015in;}
  .seq .step .n{display:inline-flex;vertical-align:middle;margin-right:0.05in;width:0.24in;height:0.24in;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;align-items:center;justify-content:center;font-size:9pt;}
  .seq .step.hold{border-color:var(--accent);border-width:0.02in;}
  .hp{display:inline-block;background:var(--accent);color:#fff;font-weight:700;font-size:7.5pt;padding:0.01in 0.05in;border-radius:0.04in;letter-spacing:.06em;}
  .takeoff table.grid td{text-align:right;}
  .takeoff table.grid td:first-child{text-align:left;}
  .disclaim{position:absolute;border:0.02in solid var(--accent);background:#fff7f2;padding:0.05in 0.12in;font-size:7.8pt;line-height:1.25;color:#222;overflow:hidden;}
  .disclaim b{color:var(--accent);}
  .siteimgs{position:absolute;display:flex;gap:0.3in;align-items:stretch;justify-content:center;}
  .siteimgs .si{flex:1;max-width:50%;border:0.008in solid var(--rule);display:flex;flex-direction:column;}
  .siteimgs .si.single{max-width:75%;}
  .siteimgs .si .im{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0.06in;}
  .siteimgs .si .im img{max-width:100%;max-height:100%;}
  .siteimgs .si .cap{border-top:0.008in solid var(--rule);padding:0.05in 0.1in;font-size:9pt;font-weight:700;}
  .siteimgs .si .cap span{font-weight:400;color:var(--grey);font-size:8pt;}
  .prose{font-size:9.2pt;line-height:1.35;white-space:pre-wrap;}
  .panel textarea{width:100%;min-height:90px;font-family:monospace;font-size:11px;border:1px solid #bbb;border-radius:4px;padding:4px 6px;}
  .panel .img-row{display:flex;align-items:center;gap:6px;margin-top:4px;}
  .panel .img-row img{width:34px;height:34px;object-fit:contain;border:1px solid #ddd;background:#fff;}
  .panel .img-row .nm{flex:1;font-size:11px;}
  .panel .img-row button{font-size:10px;padding:2px 6px;}
  .wm{position:absolute;left:1in;top:0.5in;width:34.5in;height:23in;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:40;}
  .wm span{transform:rotate(-20deg);font-size:120pt;font-weight:900;color:rgba(242,106,27,.10);letter-spacing:.1em;white-space:nowrap;}
  .wm.hidden{display:none;}
  .sq{position:absolute;left:1.15in;top:22.25in;width:1in;height:1in;border:0.01in solid var(--rule);display:flex;align-items:center;justify-content:center;font-size:6pt;color:var(--grey);text-align:center;}
  @media print{
    body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .panel{display:none!important;}
    .stage{margin:0;padding:0;}
    .sheet{box-shadow:none;margin:0;page-break-after:always;}
    .sheet:last-child{page-break-after:auto;}
  }
  @page{size:36in 24in;margin:0;}
</style>
</head>
<body>
<aside class="panel">
  <h1>Foundation Sheet Set <span style="font-size:10px;color:#888">V1.3</span></h1>
  <div style="font-size:11px;color:#666;">Edit the common fields here, or load a project JSON. Everything else renders from <code>PROJECT</code>.</div><div id="modeBanner" style="margin-top:6px;padding:6px 8px;border-radius:4px;font-size:11px;font-weight:700;"></div>
  <label>Code family</label><select id="p_codeFam"><option value="ibc2024">2024 IBC / 2024 IRC</option><option value="ibc2021">2021 IBC / 2021 IRC (with amendments)</option><option value="cbc2025">2025 CBC / 2025 CRC (California)</option><option value="fbc2023">2023 FBC 8th Ed. (Florida)</option><option value="custom">Custom…</option></select>
  <div id="codeCustom" style="display:none;border:1px dashed #bbb;padding:6px;margin-top:4px;">
    <input id="p_cbc" placeholder="Building code, e.g. 2021 Texas … (IBC)" style="margin-bottom:4px;"><input id="p_crc" placeholder="Residential code" style="margin-bottom:4px;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;"><input id="p_cB" placeholder="Bldg. abbrev. (IBC)"><input id="p_cR" placeholder="Res. abbrev. (IRC)"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px;"><input id="p_casce" placeholder="ASCE/SEI 7-22"><input id="p_caci" placeholder="ACI 318-19"></div>
    <input id="p_cgreen" placeholder="Green / energy code (optional)" style="margin-top:4px;"><input id="p_cmod" placeholder="Modular program name (optional)" style="margin-top:4px;"><input id="p_cmodref" placeholder="Modular program statute (optional)" style="margin-top:4px;">
  </div>
  <label>Project no.</label><input id="p_projNo">
  <label>Client</label><input id="p_client">
  <label>Site address</label><input id="p_address">
  <label>Jurisdiction (city / county)</label><input id="p_juris">
  <label>Date</label><input id="p_date" type="date">
  <label>Revision</label><input id="p_rev">
  <label>Status</label><select id="p_status"><option value="draft">PRELIMINARY — NOT FOR CONSTRUCTION</option><option value="sample">SAMPLE — NOT FOR CONSTRUCTION</option><option value="review">RELEASED FOR REVIEW</option><option value="permit">RELEASED FOR PERMIT</option><option value="construction">RELEASED FOR CONSTRUCTION</option></select>
  <label>Engineer of record</label><input id="p_eor">
  <label>Calc reference</label><input id="p_calcRef">
  <label style="margin-top:12px;border-top:1px solid #ddd;padding-top:8px;">Flood zone (FEMA FIRM)</label>
  <div style="display:grid;grid-template-columns:1fr 2fr;gap:4px;"><input id="p_floodZone" placeholder="X"><input id="p_floodPanel" placeholder="FIRM panel no."></div>
  <input id="p_floodDate" placeholder="FIRM effective date" style="margin-top:4px;">
  <label id="lblFire">Wildfire hazard</label>
  <select id="p_fhsz"></select>
  <label>Fire sprinklers</label>
  <select id="p_spr"></select>
  <label>Unit serial no. · state insignia / label no. <span style="font-weight:400;color:#888">(leave blank to print "to be provided")</span></label>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;"><input id="p_bin" placeholder="BIN"><input id="p_insignia" placeholder="Insignia no."></div>
  <label>Project information (printed under "How to read this set" — parcel, APN, zoning, misc.)</label><textarea id="p_info" placeholder="APN 0000-000-00 · Zoning R-1 · Lot 7,500 sf&#10;Notes..."></textarea>
  <label style="margin-top:12px;border-top:1px solid #ddd;padding-top:8px;">Images — click Replace to upload (saved into the project JSON)</label>
  <div id="imgList"></div>
  <label>Site image A caption</label><select id="p_capApre"><option>Aerial view — Google Maps</option><option>Parcel view — parcel info</option><option value="custom">Custom…</option></select><input id="p_capA" placeholder="custom caption" style="margin-top:4px;">
  <label>Site image B caption</label><select id="p_capBpre"><option>Aerial view — Google Maps</option><option selected>Parcel view — parcel info</option><option value="custom">Custom…</option></select><input id="p_capB" placeholder="custom caption" style="margin-top:4px;">
  <button class="btn" onclick="window.print()">Print / Save PDF (36×24)</button>
  <button class="btn sec" onclick="exportJSON()">⤓ Save project (.json)</button>
  <button class="btn sec" onclick="document.getElementById('p_file').click()">⤒ Load project</button>
  <input type="file" id="p_file" accept=".json" hidden>
  <div style="margin-top:10px;font-size:10px;color:#888;">Half-size print: set printer scaling to 50% on 18×12 / 11×17 (title block reads FULL SIZE 24×36).</div>
</aside>

<main class="stage" id="stage"></main>

<script>
/* ═══════════════════════════════════════════════════════════════════
   PROJECT — the single source of truth (mirrors the calc tool inputs)
   ═══════════════════════════════════════════════════════════════════ */
const PROJECT = {
  firm:{ name:"Oasis Engineering", site:"boxablfoundations.com", line:"oasisengineering.com", entity:"Oasis Engineering LLC",
         legal:"These drawings, details, notes and the design of this sheet are instruments of service and the copyrighted property of Oasis Engineering LLC. Their use is licensed solely for the project and site named on this sheet. Reuse, reproduction, modification or distribution, in whole or in part, without the written permission of Oasis Engineering LLC is prohibited.",
         affil:"BoxablFoundations.com is an independent service operated by Oasis Engineering LLC. It is not affiliated with, endorsed by, or sponsored by Boxabl Inc. BOXABL is a trademark of Boxabl Inc.; Boxabl images and product data are the property of Boxabl Inc. and are used under Boxabl's affiliate program." },
  engineered:false,   // false = published-safe; true only in a controlled project JSON
  projNo:"____-___", client:"Client name", address:"Site address, City, ST ZIP",
  date:"", rev:"0", status:"draft", eor:"", calcRef:"Site-specific structural calculations (controlled workflow)",
  jurisdiction:"", info:"", capA:"Aerial view — Google Maps", capB:"Parcel view — parcel info",
  flood:{ zone:"X", panel:"06071C____", date:"" },
  fire:{ fhsz:"verify", sprinklers:"verify" },
  hcd:{ bin:"", insignia:"" },
  unit:{ model:"Boxabl 2 Door Casita — BXB-000009", L:19, B:19, h:10.75, esr:"ICC-ES ESR-4725", area:361 },
  code:{ family:"ibc2024", custom:{ bc:"", rc:"", B:"IBC", R:"IRC", asce:"ASCE/SEI 7-22", aci:"ACI 318-19", green:"", modular:"", modularRef:"" } },
  get codes(){ return CODE().text; },
  loads:{ roofDL:16, roofLL:20, floorDL:20, floorLL:40, wallDL:6 },
  wind:{ V:100, exp:"C", risk:"II", Kd:0.85, G:0.85, GCpi:0.18, hm:10.5, Kzt:1.0, Ke:1.0, enclosure:"Enclosed" },
  snow:{ pg:10, pf:8.4, pm:10, Ce:1.0, Ct:1.2, Is:1.0 },
  seismic:{ Ss:1.94, S1:0.63, SMS:2.09, SM1:1.50, SDS:1.39, SD1:1.00, TL:8, siteClass:"Default (§11.4.2.1)", SDC:"D", R:6.5, Om:3.0, Cd:4.0, Ie:1.0, rho:1.0, Cs:0.214, system:"Bearing wall — Boxabl SIP shear walls per ESR-4725" },
  soil:{ qall:2000, mu:0.25, basis:"Presumptive values, building-code Table 1806.2 (sand, silty sand, clayey sand)", frost:12 },
  conc:{ fc:null, fy:60000, cement:"ASTM C150 Type II (Type V where sulfate soils are identified)", slump:5, agg:1 },
  footing:{ B:null, H:null, above:8, nL:null, szL:"#_", szS:"#_", sS:null, cover:null, lap:null },
  slab:{ t:null, wwr:"W.W.R. per engineered design", gravel:6, vapor:"10 mil polyethylene (Stego Wrap or equal, ASTM E1745 Class A)" },
  sheets:[ ["S0.0","Cover Sheet, General Notes & Design Criteria"], ["S1.0","Foundation Plan & Details"] ]
};

/* ═══════════════════════════════════════════════════════════════════
   DETAIL LIBRARY — images injected by build script (base64)
   ═══════════════════════════════════════════════════════════════════ */
const IMG = { logo:"__LOGO__", render:"__RENDER__", qr:"__QR__", aerial:"__AERIAL__", parcel:"__PARCEL__", plan:"__PLAN__", turndown:"__TURNDOWN__", slab:"__SLAB__", plates:"__PLATES__", rebar:"__REBAR__", corner:"__CORNER__" };
const IMG_LABELS = { logo:"Logo (title block)", render:"S0.0 unit image (Boxabl)", qr:"S0.0 QR code", aerial:"S0.0 site image A", parcel:"S0.0 site image B", plan:"S1.0 · 1 Foundation plan", turndown:"S1.0 · 2 Turndown section", slab:"S1.0 · 3 Slab-on-grade", plates:"S1.0 · 5 Boxabl plates", rebar:"S1.0 · 6 Rebar development", corner:"S1.0 · 4 Footing corner (replaces drawn detail)" };
const has = k => typeof IMG[k]==="string" && IMG[k].startsWith("data:");

/* ═══════════════════════════════════════════════════════════════════
   GENERAL NOTES — tagged data, ordered by construction sequence
   tags: all | slab | pier | stem | sdcD | frost
   ═══════════════════════════════════════════════════════════════════ */
const NOTES_FN = () => [
 {h:"General", items:[
  `The governing code for this project is the ${CODE().bc} with the ${CODE().rc}, ${CODE().asce} and ${CODE().aci}${CODE().green?" and the "+CODE().green:""}. The governing code prescribes which edition of each referenced standard applies.`,
  "To the best of our knowledge these structural drawings and notes comply with the applicable requirements of the governing code. Construction shall comply with the governing code and all applicable federal, state and local codes, standards, regulations and laws.",
  "These foundation drawings shall be used together with the Boxabl installation manual, the Boxabl structural plans for the unit and ICC-ES ESR-4725. The foundation is designed for the unit reactions stated in the design criteria; the unit, its connections, hold-downs and anchorage hardware are by Boxabl and are a deferred submittal. Where a conflict exists, notify the engineer before proceeding; the more stringent requirement governs.",
  "Details labeled \"TYP\" apply to all conditions that are the same or similar to those referenced, whether or not keyed at each location.",
  "Do not scale drawings; use printed dimensions only. Verify all dimensions and conditions in the field and report discrepancies in writing to the engineer before proceeding. Do not change the size, location or reinforcing of any foundation element without written instruction from the engineer of record.",
  "The contractor is solely responsible for construction means and methods, sequencing, scheduling, quantities and cost, jobsite safety including all OSHA requirements, temporary bracing and shoring, and protection of adjacent property, the work and the public. The build sequence and materials takeoff shown on S1.0 are provided for orientation only, are preliminary, and are not a contractor's estimate or a construction procedure; the engineer assumes no responsibility or liability for materials, quantities, sequencing, or means and methods of construction.",
  `Before excavating, ${CODE().locate} at least two working days in advance. The contractor is responsible for locating, protecting and repairing all utilities.`,
  `Foundation location, orientation, setbacks and finished-floor elevation are per the site plan by others, which is not part of this sealed set. Set the 0,0 layout corner and the orientation of the foundation from the site plan before layout; confirm the finished floor is a minimum of 8 in above finish grade and that grade slopes away from the foundation 5% for 10 ft (2% on impervious surfaces) per ${CODE().R} R401.3 / ${CODE().B} §1804.4.`,
 ]},
 {h:"Coordination with Boxabl", items:[
  "Verify the actual unit outside dimensions, wall-panel locations, stainless-steel plate locations and spacing, utility and plumbing penetration locations, and anchorage requirements against the Boxabl installation drawings for the unit's serial number before forming. Dimensions on these drawings are nominal from the Boxabl BXB-000009 data.",
  "Boxabl stainless-steel plates (detail 5/S1.0) shall be set per the Boxabl template and installation manual, plumb, level and at the specified spacing, and secured to the forms or reinforcing before placement so they do not move during the pour. Plate anchorage to the concrete and the unit-to-plate connection are by Boxabl.",
  `Top of slab shall be level within 1/4 in over the unit footprint and flat to 1/8 in in 10 ft (FF 25 / FL 20 minimum). Where the Boxabl installation manual is more stringent, it governs. Do not set the unit until the concrete has reached the specified strength (${ev(PROJECT.conc.fc," psi")}, 7 days minimum) or as required by Boxabl.`,
  "Underslab plumbing, electrical sleeves and conduit shall be located per the Boxabl utility drawings and coordinated with the plumbing/electrical contractor before the vapor retarder is placed. Penetrations through the turned-down footing are not permitted; sleeve through the slab only.",
 ]},
 {h:"Foundation Design Basis", items:[
  `Allowable soil bearing ${num(PROJECT.soil.qall)} psf and coefficient of friction ${PROJECT.soil.mu} are presumptive values per ${CODE().B} Table 1806.2 for sand, silty sand and clayey sand, based on visual classification. If a geotechnical investigation is required by the building official (${CODE().B} §1803) or is otherwise provided, its recommendations supersede these values; notify the engineer of any difference.`,
  "Should fill, expansive or collapsible soil, organics, debris, groundwater, rock or any condition other than firm native sand be encountered at the bearing elevation, stop work and notify the engineer before proceeding. The engineer will supply written direction; a letter attesting that site conditions match the design basis may be required by the building official.",

/* ═══════════════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════════════ */
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const num = (x,dp=0)=> Number.isFinite(x)? x.toLocaleString("en-US",{minimumFractionDigits:dp,maximumFractionDigits:dp}) : "—";
const ft = x => `${Math.floor(x)}'-${Math.round((x-Math.floor(x))*12)}"`;
const STATUS = { sample:"SAMPLE — FOR ILLUSTRATION ONLY — NOT FOR CONSTRUCTION", draft:"PRELIMINARY — NOT FOR CONSTRUCTION", review:"RELEASED FOR REVIEW", permit:"RELEASED FOR PERMIT", construction:"RELEASED FOR CONSTRUCTION" };

/* ── controlled-value gate: prints "per engineered design" unless PROJECT.engineered ── */
const ENG = () => !!PROJECT.engineered;
const ev = (v, suffix="", dp=0) => ENG() && v!==null && v!==undefined && v!=="" ? (typeof v==="number" ? num(v,dp) : esc(v)) + suffix : "per engineered design";
const evb = (v, suffix="") => ENG() && v!==null && v!==undefined && v!=="" ? String(v)+suffix : "—";

/* ── code family: every citation, program name and option set derives from this ── */
const CODE_FAMILIES = {
  ibc2024:{ label:"2024 IBC / 2024 IRC", bc:"2024 International Building Code (IBC)", rc:"2024 International Residential Code (IRC)", B:"IBC", R:"IRC", asce:"ASCE/SEI 7-22", aci:"ACI 318-19", green:"", state:"", locate:"call 811 (the state one-call utility locating service)", modular:"the state industrialized / modular building program", modularRef:"state law and the program's rules" },
  ibc2021:{ label:"2021 IBC / 2021 IRC (with amendments)", bc:"2021 International Building Code (IBC), as amended by the state and local jurisdiction", rc:"2021 International Residential Code (IRC), as amended", B:"IBC", R:"IRC", asce:"ASCE/SEI 7-16", aci:"ACI 318-19", green:"", state:"", locate:"call 811 (the state one-call utility locating service)", modular:"the state industrialized / modular building program", modularRef:"state law and the program's rules" },
  cbc2025:{ label:"2025 CBC / 2025 CRC (California)", bc:"2025 California Building Code (CBC)", rc:"2025 California Residential Code (CRC)", B:"CBC", R:"CRC", asce:"ASCE/SEI 7-22", aci:"ACI 318-19", green:"2025 CALGreen", state:"CA", locate:"call 811 (Underground Service Alert / DigAlert)", modular:"California Factory-Built Housing (HCD)", modularRef:"Health and Safety Code §19960 et seq. and Title 25 CCR Div. 1 Ch. 3 Subch. 1; insignia per H&SC §19980" },
  fbc2023:{ label:"2023 FBC 8th Ed. (Florida)", bc:"2023 Florida Building Code, Building, 8th Edition", rc:"2023 Florida Building Code, Residential, 8th Edition", B:"FBC-B", R:"FBC-R", asce:"ASCE/SEI 7-22", aci:"ACI 318-19", green:"", state:"FL", locate:"call 811 (Sunshine 811)", modular:"the Florida DBPR Manufactured Buildings Program", modularRef:"Florida Statutes §§553.35–553.42 and Rule 61-41 F.A.C.; insignia per §553.415" },
  custom:{ label:"Custom", bc:"", rc:"", B:"IBC", R:"IRC", asce:"ASCE/SEI 7-22", aci:"ACI 318-19", green:"", state:"", locate:"call 811 (the state one-call utility locating service)", modular:"the state industrialized / modular building program", modularRef:"state law and the program's rules" }
};
function CODE(){ const f=CODE_FAMILIES[PROJECT.code.family]||CODE_FAMILIES.ibc2024; const c=Object.assign({},f); if(PROJECT.code.family==="custom") Object.assign(c, PROJECT.code.custom||{}); c.isCA=c.state==="CA"; c.text=[c.bc,c.rc,c.asce,c.aci,c.green].filter(Boolean).join(" · "); return c; }
const CA = () => CODE().isCA;

/* ── site hazard text ─────────────────────────────────────────── */
const FIRE_OPTS = {
  ca:[["verify","To be verified — CAL FIRE FHSZ viewer"],["none","Not in a Fire Hazard Severity Zone"],["moderate","Moderate FHSZ (LRA)"],["high","High FHSZ (LRA)"],["vhigh","Very High FHSZ (LRA)"],["sra","State Responsibility Area (SRA)"],["fra","Federal Responsibility Area (FRA) — no FHSZ designation"]],
  us:[["verify","To be verified — AHJ wildland-urban interface map"],["none","Not in a designated wildland-urban interface area"],["wui","Designated WUI area — local WUI code applies"]] };
const SPR_OPTS = {
  ca:[["verify","Per AHJ and the HCD-approved unit plans — verify"],["required","Required — new dwelling, CRC R313"],["adu","Not required — ADU exception (Gov. Code §66323)"]],
  us:[["verify","Per AHJ — verify local adoption of IRC R313"],["required","Required — new dwelling, IRC R313 as adopted"],["notreq","Not required — IRC R313 amended out by the state/AHJ"]] };
const FHSZ_TXT_US = { verify:"To be verified by owner/contractor against the AHJ's wildland-urban interface map before permit application", none:"Not within a designated wildland-urban interface area", wui:"Designated wildland-urban interface area" };
const FHSZ_TXT = { verify:"To be verified by owner/contractor on the CAL FIRE FHSZ viewer before permit application", none:"Not within a Fire Hazard Severity Zone", moderate:"Moderate Fire Hazard Severity Zone (LRA)", high:"High Fire Hazard Severity Zone (LRA)", vhigh:"Very High Fire Hazard Severity Zone (LRA)", sra:"State Responsibility Area (SRA)", fra:"Federal Responsibility Area (FRA) — no Fire Hazard Severity Zone designation (CAL FIRE); local fire protection agency San Bernardino County Fire" };
const SPR_TXT_CA = { verify:"Per AHJ and the HCD-approved unit plans — verify", required:"Required — new one-family dwelling, CRC R313.2 (unit system by manufacturer; supply by others)", adu:"Not required — accessory dwelling unit exception, Gov. Code §66323 (verify primary dwelling status)" };
const SPR_TXT_US = { verify:"Per AHJ — verify local adoption of IRC R313", required:"Required — new one-family dwelling, IRC R313.2 as adopted (unit system by manufacturer; supply by others)", notreq:"Not required — IRC R313 amended out by the state or AHJ" };
const fireTxt = P => (CA()?FHSZ_TXT:FHSZ_TXT_US)[P.fire.fhsz]||"";
const sprTxt = P => (CA()?SPR_TXT_CA:SPR_TXT_US)[P.fire.sprinklers]||"";
const inSFHA = P => /^(A|V)/i.test((P.flood.zone||"").trim());
const wui = P => ["high","vhigh","sra","wui"].includes(P.fire.fhsz);

/* ── materials takeoff, from the same numbers the calc uses ──────── */
function takeoff(P){
  const Bf=P.footing.B/12, Hf=P.footing.H/12, ts=P.slab.t/12;
  const cl = 2*((P.unit.L-Bf)+(P.unit.B-Bf));                 // ft   footing centerline perimeter
  const vFtg = Bf*Hf*cl;                                      // ft³
  const vSlab = (P.unit.L-2*Bf)*(P.unit.B-2*Bf)*ts;           // ft³
  const cy = (vFtg+vSlab)/27;                                 // cy
  const laps = Math.ceil(cl/20);                              // one lap per 20-ft stock bar, per bar
  const lfLong = P.footing.nL*(cl + laps*P.footing.lap/12);   // lf  continuous bars incl. laps
  const lfCorner = 4*2*2*(2*P.footing.lap/12);                // lf  (2) bars × 2 faces × 4 corners × 2 legs
  const nStir = Math.ceil(cl*12/P.footing.sS);
  const lStir = (2*(P.footing.B-2*P.footing.cover)+2*(P.footing.H-2*P.footing.cover)+12)/12;  // lf incl. hooks
  const lfStir = nStir*lStir;
  const sfWWR = P.unit.L*P.unit.B*1.15;
  const sfVapor = P.unit.L*P.unit.B*1.15;
  const cyGravel = P.unit.L*P.unit.B*(P.slab.gravel/12)/27;
  return { cy:cy*1.10, cyNet:cy, lfLong, lfCorner, nStir, lfStir, lbRebar:(lfLong+lfCorner+lfStir)*0.668, sfWWR, sfVapor, cyGravel, cl };
}

/* ── isometric of the box on its slab (SVG, from unit dims) ─────── */
function isoBox(P, w=560, h=400){
  const L=P.unit.L, B=P.unit.B, H=P.unit.h, s=w/(L+B)/1.05;
  const c=Math.cos(Math.PI/6), n=Math.sin(Math.PI/6);
  const px=(x,y,z)=>[w/2+(x-y)*c*s, h*0.78-(x+y)*n*s-z*s];
  const poly=(pts,f,st="#222",sw=1.2)=>`<polygon points="${pts.map(p=>p.join(",")).join(" ")}" fill="${f}" stroke="${st}" stroke-width="${sw}" stroke-linejoin="round"/>`;
  const o=1.0, t=0.67;   // slab overhang & thickness (ft) for the drawing only
  let g="";
  g+=poly([px(-o,-o,-t),px(L+o,-o,-t),px(L+o,-o,0),px(-o,-o,0)],"#c9ccd1");
  g+=poly([px(L+o,-o,-t),px(L+o,B+o,-t),px(L+o,B+o,0),px(L+o,-o,0)],"#b3b7bd");
  g+=poly([px(-o,-o,0),px(L+o,-o,0),px(L+o,B+o,0),px(-o,B+o,0)],"#e3e5e8");
  g+=poly([px(0,0,0),px(L,0,0),px(L,0,H),px(0,0,H)],"#f2f4f7");
  g+=poly([px(L,0,0),px(L,B,0),px(L,B,H),px(L,0,H)],"#d8dce3");
  g+=poly([px(0,0,H),px(L,0,H),px(L,B,H),px(0,B,H)],"#fafbfc");
  // door + windows on front face
  const rect=(x0,x1,z0,z1,f)=>poly([px(x0,0,z0),px(x1,0,z0),px(x1,0,z1),px(x0,0,z1)],f,"#333",0.8);
  g+=rect(L*0.42,L*0.58,0,7,"#5a6a85"); g+=rect(L*0.1,L*0.3,3,7,"#9fb6d9"); g+=rect(L*0.7,L*0.9,3,7,"#9fb6d9");
  const rectS=(y0,y1,z0,z1,f)=>poly([px(L,y0,z0),px(L,y1,z0),px(L,y1,z1),px(L,y0,z1)],f,"#333",0.8);
  g+=rectS(B*0.3,B*0.5,3,7,"#8ea6c9"); g+=rectS(B*0.6,B*0.8,3,7,"#8ea6c9");
  const lab=(p,t)=>`<text x="${p[0]}" y="${p[1]}" font-family="Arial" font-size="12" text-anchor="middle" fill="#222">${t}</text>`;
  g+=lab([px(L/2,-o,-t)[0],px(L/2,-o,-t)[1]+18],`${ft(L)}`);
  g+=lab([px(L+o,B/2,-t)[0]+34,px(L+o,B/2,-t)[1]+12],`${ft(B)}`);
  g+=lab([px(L+o,B+o,H/2)[0]+40,px(L+o,B+o,H/2)[1]],`${ft(H)} wall`);
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}

/* ── turndown corner detail, plan view (parametric SVG) ─────────── */
function cornerDetail(P){
  const E=ENG(), Bin=E?P.footing.B:16, cvin=E?P.footing.cover:3, lapin=E?P.footing.lap:32;
  const s=40, B=Bin/12*s, leg=3.2*s, cv=cvin/12*s, lap=lapin/12*s;
  const W=leg+40, H=leg+40, x0=20, y0=20;
  let g=`<rect x="${x0}" y="${y0}" width="${B}" height="${leg}" fill="#d4d4d4" stroke="#222" stroke-width="1.5"/>`;
  g+=`<rect x="${x0}" y="${y0}" width="${leg}" height="${B}" fill="#d4d4d4" stroke="#222" stroke-width="1.5"/>`;
  g+=`<rect x="${x0}" y="${y0}" width="${B}" height="${B}" fill="#d4d4d4" stroke="none"/>`;
  g+=`<line x1="${x0+B}" y1="${y0+B}" x2="${x0+B}" y2="${y0+leg}" stroke="#222" stroke-width="1.5"/><line x1="${x0+B}" y1="${y0+B}" x2="${x0+leg}" y2="${y0+B}" stroke="#222" stroke-width="1.5"/>`;
  // continuous bars, outer and inner faces (bottom layer shown)
  const bar=(x1,y1,x2,y2,c="#111",w=2.2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
  g+=bar(x0+cv,y0+cv,x0+cv,y0+leg); g+=bar(x0+cv,y0+cv,x0+leg,y0+cv);
  g+=bar(x0+B-cv,y0+B-cv,x0+B-cv,y0+leg); g+=bar(x0+B-cv,y0+B-cv,x0+leg,y0+B-cv);
  // corner bars (orange) lapped with continuous bars
  const cb="#F26A1B";
  g+=bar(x0+cv+5,y0+cv+5,x0+cv+5,y0+cv+5+lap,cb,3); g+=bar(x0+cv+5,y0+cv+5,x0+cv+5+lap,y0+cv+5,cb,3);
  g+=bar(x0+B-cv-5,y0+B-cv-5,x0+B-cv-5,y0+B-cv-5+lap,cb,3); g+=bar(x0+B-cv-5,y0+B-cv-5,x0+B-cv-5+lap,y0+B-cv-5,cb,3);
  const t=(x,y,s,a="start")=>`<text x="${x}" y="${y}" font-family="Arial" font-size="11" text-anchor="${a}" fill="#111">${s}</text>`;
  const ld=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#111" stroke-width="0.8"/>`;
  const lx=x0+leg+14;
  g+=t(lx,y0+10,E?`(${P.footing.nL/2}) ${P.footing.szL} CONTINUOUS EACH FACE,`:"CONTINUOUS BARS EACH FACE,"); g+=t(lx,y0+24,E?`TOP & BOTTOM — LAP ${P.footing.lap}" MIN.`:"TOP & BOTTOM — SIZE, COUNT & LAP PER ENGINEERED DESIGN");
  g+=ld(lx-4,y0+14,x0+leg-2,y0+cv);
  g+=t(lx,y0+58,E?`(2) ${P.footing.szL} CORNER BARS EACH FACE,`:"CORNER BARS EACH FACE,"); g+=t(lx,y0+72,E?`TOP & BOTTOM, ${P.footing.lap}" LEGS,`:"TOP & BOTTOM, LEGS PER ENGINEERED DESIGN,"); g+=t(lx,y0+86,`LAP WITH CONTINUOUS BARS`);
  g+=ld(lx-4,y0+66,x0+cv+5+lap,y0+cv+5);
  g+=t(lx,y0+118,E?`${P.footing.szS} CLOSED STIRRUPS @ ${P.footing.sS}" O.C.`:"CLOSED STIRRUPS PER ENGINEERED DESIGN"); g+=t(lx,y0+132,`CONTINUE AROUND CORNER`);
  g+=ld(lx-4,y0+124,x0+leg-2,y0+B-cv);
  g+=ld(x0,y0+leg+14,x0+B,y0+leg+14); g+=t(x0+B/2,y0+leg+30,E?`${P.footing.B}" TURNDOWN`:"TURNDOWN WIDTH PER DESIGN","middle");
  g+=t(x0+B+20,y0+leg+30,E?`${P.footing.cover}" CLR TYP · OUTSIDE FACE OF TURNDOWN = WALL LINE`:"OUTSIDE FACE OF TURNDOWN = WALL LINE · COVER PER DESIGN");
  return `<svg viewBox="0 0 ${W+420} ${H+30}" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}

    + slot("d4", 0, 14.55, 8.5, 5.45, 4, "Footing corner reinforcing (plan)", "N.T.S.", has("corner") ? `<div class="imgwrap"><img src="${IMG.corner}" alt="corner"></div>` : cornerDetail(P))
    + slot("d5", 22.6, 1.15, 8.9, 9.5, 5, "Boxabl stainless steel plates", "N.T.S. · LOCATE PER BOXABL", has("plates")?`<div class="imgwrap tall"><img src="${IMG.plates}" alt="plates"></div>`:`<div style="color:#999;text-align:center;font-size:11pt;">Manufacturer plate detail<br><span style="font-size:8pt">upload from the panel · controlled workflow</span></div>`)
    + slot("d6", 22.6, 10.85, 8.9, 9.15, 6, "Rebar development, laps & hooks", "N.T.S.", has("rebar")?`<div class="imgwrap tall"><img src="${IMG.rebar}" alt="rebar"></div>`:`<div style="color:#999;text-align:center;font-size:11pt;">Rebar development, lap &amp; hook schedule<br><span style="font-size:8pt">upload from the panel · controlled workflow</span></div>`)
    + seq + take;
  return chrome(P,"S1.0",P.sheets[1][1],inner);
}

/* ═══════════════════════════════════════════════════════════════════
   RENDER LOOP + JSON
   ═══════════════════════════════════════════════════════════════════ */
const $=id=>document.getElementById(id);
function capVal(pre,cus){ const p=$(pre).value; return p==="custom" ? ($(cus).value||"") : p; }
function gather(){
  PROJECT.info=$("p_info").value;
  PROJECT.flood={ zone:$("p_floodZone").value.trim()||"—", panel:$("p_floodPanel").value.trim(), date:$("p_floodDate").value.trim() };
  PROJECT.code.family=$("p_codeFam").value; PROJECT.code.custom={ bc:$("p_cbc").value, rc:$("p_crc").value, B:$("p_cB").value||"IBC", R:$("p_cR").value||"IRC", asce:$("p_casce").value||"ASCE/SEI 7-22", aci:$("p_caci").value||"ACI 318-19", green:$("p_cgreen").value, modular:$("p_cmod").value||"the state industrialized / modular building program", modularRef:$("p_cmodref").value||"state law and the program's rules" };
  $("codeCustom").style.display = PROJECT.code.family==="custom" ? "block" : "none";
  syncFireOptions();
  PROJECT.fire={ fhsz:$("p_fhsz").value, sprinklers:$("p_spr").value };
  PROJECT.hcd={ bin:$("p_bin").value.trim(), insignia:$("p_insignia").value.trim() }; PROJECT.capA=capVal("p_capApre","p_capA"); PROJECT.capB=capVal("p_capBpre","p_capB");
  PROJECT.projNo=$("p_projNo").value; PROJECT.client=$("p_client").value; PROJECT.address=$("p_address").value; PROJECT.jurisdiction=$("p_juris").value;
  PROJECT.date=$("p_date").value; PROJECT.rev=$("p_rev").value; PROJECT.status=$("p_status").value; PROJECT.eor=$("p_eor").value; PROJECT.calcRef=$("p_calcRef").value;
}
function syncFireOptions(){
  const ca = (CODE_FAMILIES[$("p_codeFam").value]||{}).state==="CA";
  $("lblFire").textContent = ca ? "Fire Hazard Severity Zone" : "Wildfire hazard (WUI)";
  const setOpts=(sel,opts)=>{ const cur=sel.value; sel.innerHTML=opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join(""); sel.value = opts.some(o=>o[0]===cur)?cur:"verify"; };
  setOpts($("p_fhsz"), ca?FIRE_OPTS.ca:FIRE_OPTS.us); setOpts($("p_spr"), ca?SPR_OPTS.ca:SPR_OPTS.us);
}
function fill(){ $("p_codeFam").value=PROJECT.code.family; const cu=PROJECT.code.custom||{}; $("p_cbc").value=cu.bc||""; $("p_crc").value=cu.rc||""; $("p_cB").value=cu.B||""; $("p_cR").value=cu.R||""; $("p_casce").value=cu.asce||""; $("p_caci").value=cu.aci||""; $("p_cgreen").value=cu.green||""; $("p_cmod").value=cu.modular||""; $("p_cmodref").value=cu.modularRef||""; syncFireOptions(); $("p_info").value=PROJECT.info||""; $("p_floodZone").value=PROJECT.flood.zone; $("p_floodPanel").value=PROJECT.flood.panel; $("p_floodDate").value=PROJECT.flood.date; $("p_fhsz").value=PROJECT.fire.fhsz; $("p_spr").value=PROJECT.fire.sprinklers; syncFireOptions(); $("p_bin").value=PROJECT.hcd.bin; $("p_insignia").value=PROJECT.hcd.insignia; $("p_projNo").value=PROJECT.projNo; $("p_client").value=PROJECT.client; $("p_address").value=PROJECT.address; $("p_juris").value=PROJECT.jurisdiction||""; $("p_date").value=PROJECT.date||new Date().toISOString().slice(0,10); $("p_rev").value=PROJECT.rev; $("p_status").value=PROJECT.status; $("p_eor").value=PROJECT.eor; $("p_calcRef").value=PROJECT.calcRef; }
function fitSiteImages(){
  const n=document.querySelector('.notes'), band=document.getElementById('siteimgs'); if(!n||!band) return;
  // shrink the notes box until the two columns just hold the content (balanced columns), then hang the image band below it
  let h=8; n.style.height=h+'in';
  while(n.scrollWidth>n.clientWidth+2 && h<21.7){ h+=0.25; n.style.height=h+'in'; }
  const content=band.parentElement.getBoundingClientRect(), nb=n.getBoundingClientRect();
  const top=(nb.bottom-content.top)/96+0.2;            // in, 0.2 in breathing room
  band.style.top=top+'in'; band.style.height=Math.max(22.4-top,3)+'in';
}
function render(){ gather(); const mb=$("modeBanner"); mb.style.background=ENG()?"#e8f5ea":"#fff4e5"; mb.style.color=ENG()?"#1e7a3b":"#b85c00"; mb.textContent=ENG()?"CONTROLLED PROJECT LOADED — engineered values and details shown":"PUBLISHED-SAFE MODE — controlled values print as “per engineered design”"; $("stage").innerHTML = (inSFHA(PROJECT)?`<div style="background:#c0392b;color:#fff;padding:8px 14px;font-weight:700;margin-bottom:12px;">Flood zone ${esc(PROJECT.flood.zone)} is a Special Flood Hazard Area — this slab-on-grade design does not apply. Foundation must be re-designed above BFE.</div>`:"") + sheetS0(PROJECT) + sheetS1(PROJECT); fitSiteImages(); imgPanel(); }
function imgPanel(){
  $("imgList").innerHTML = Object.keys(IMG_LABELS).map(k=>`<div class="img-row">${has(k)?`<img src="${IMG[k]}">`:`<div style="width:34px;height:34px;border:1px dashed #bbb;"></div>`}<div class="nm">${IMG_LABELS[k]}</div><button onclick="pickImg('${k}')">Replace</button>${(k==="aerial"||k==="parcel"||k==="render"||k==="corner")&&has(k)?`<button onclick="clearImg('${k}')">×</button>`:""}</div>`).join("");
}
function pickImg(k){ const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*"; inp.onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ IMG[k]=rd.result; render(); }; rd.readAsDataURL(f); }; inp.click(); }
function clearImg(k){ IMG[k]=""; render(); }
function exportJSON(){ gather(); const images={}; Object.keys(IMG).forEach(k=>{ if(has(k)) images[k]=IMG[k]; }); const blob=new Blob([JSON.stringify({_meta:{framework:"ephemeral-eng",tool:"Foundation Sheet Set",toolVersion:"V1.3",saved:new Date().toISOString(),source:"user"},project:PROJECT,images},null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`${PROJECT.projNo.replace(/[^\w-]+/g,"_")}_sheets_project.json`; a.click(); }
$("p_file").addEventListener("change",e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const st=JSON.parse(rd.result); const sp=st.project||st; delete sp.codes; if(!sp.code) sp.code={family:"cbc2025",custom:{}}; Object.assign(PROJECT, sp); if(st.images) Object.assign(IMG, st.images); fill(); render(); }catch(err){ alert("Could not parse JSON"); } }; rd.readAsText(f); e.target.value=""; });
document.querySelectorAll(".panel input,.panel select,.panel textarea").forEach(el=>{ el.addEventListener("input",render); el.addEventListener("change",render); });
fill(); render();
</script>
